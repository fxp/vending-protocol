services:

  mock:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./adapters/ucp/mock:/app
      - ./adapters/ucp/requirements.txt:/requirements.txt:ro
    command: >
      sh -c "pip install -q -r /requirements.txt && python server.py"
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BASE_URL: "http://localhost:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/.well-known/ucp')"]
      interval: 5s
      timeout: 3s
      retries: 5
