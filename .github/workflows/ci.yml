name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python mock server tests ────────────────────────────────────────────────
  pytest:
    name: pytest (UCP mock server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adapters/ucp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-anyio httpx anyio
        working-directory: adapters/ucp

      - name: Run tests
        run: pytest test_server.py -v --tb=short
        working-directory: adapters/ucp/mock

  # ── TypeScript type-check (Cloudflare mock worker) ──────────────────────────
  typecheck:
    name: Type check (mock-worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare/mock-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare/mock-worker

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: cloudflare/mock-worker

  # ── Deploy 已退役（2026-06-12）──────────────────────────────────────────────
  # ucp-mock 旧 demo worker 已删除（被新架构 ADR-14 取代：ucp-vending-machine）。
  # 此 repo 仅保留 pytest + typecheck 作参考，不再自动部署。
  # 如需恢复部署，从 git 历史取回 deploy job。
